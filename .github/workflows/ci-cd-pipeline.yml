name: CI/CD Pipeline

on:
  push:
    branches:
      - development

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      
      - name: Set up JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Build and test Product Service with Maven
        working-directory: product
        run: |
          mvn clean install -Ptest
          mvn test -Ptest

      - name: Build and test Order Service with Maven
        working-directory: order
        run: |
          mvn clean install -Ptest
          mvn test -Ptest

  docker_build_push:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image for Product
        uses: docker/build-push-action@v5
        with:
          push: true
          context: ./product
          tags: mrceski/kiii-proekt-product:latest

      - name: Build and push image for Order
        uses: docker/build-push-action@v5
        with:
          push: true
          context: ./order
          tags: mrceski/kiii-proekt-order:latest

  deploy:
    runs-on: ubuntu-latest
    needs: docker_build_push
    steps:
      - name: Checkout Production Branch
        uses: actions/checkout@v4
        with:
          ref: production

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Configure Kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 --decode > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          export KUBECONFIG=$HOME/.kube/config

      - name: Deploy Kubernetes Manifests
        run: |
          kubectl apply -f namespace.yml
          kubectl apply -f config.yml -f secrets.yml -f db-config.yml -f db-secrets.yml
          kubectl apply -f mysql-service.yml
          kubectl apply -f mysql-statefulset.yml
          
          # Wait for MySQL StatefulSet to be ready
          echo "Waiting for MySQL to be ready..."
          kubectl wait --for=condition=ready pod -l app=mysql --timeout=300s
          
          kubectl apply -f product-service.yml -f order-service.yml
          kubectl apply -f product-deployment.yml -f order-deployment.yml
          kubectl apply -f ingress.yml
          
      - name: Verify Deployment
        run: |
          kubectl get pods -n kiii-proekt
          kubectl get services -n kiii-proekt
          kubectl get ingress -n kiii-proekt