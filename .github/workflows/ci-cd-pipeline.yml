name: CI/CD Pipeline

on:
  push:
    branches:
      - development

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      
      - name: Set up JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Build and test Product Service with Maven
        working-directory: product
        run: |
          mvn clean install
          mvn test

      - name: Build and test Order Service with Maven
        working-directory: order
        run: |
          mvn clean install
          mvn test

  docker_build_push:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image for Product
        uses: docker/build-push-action@v5
        with:
          push: true
          context: ./product
          tags: mrceski/kiii-proekt-product:latest

      - name: Build and push image for Order
        uses: docker/build-push-action@v5
        with:
          push: true
          context: ./order
          tags: mrceski/kiii-proekt-order:latest