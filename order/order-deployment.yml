apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-deployment
  namespace: kiii-proekt
spec:
  replicas: 3
  selector:
    matchLabels:
      app: order-kiii-proekt
  template:
    metadata:
      labels:
        app: order-kiii-proekt
    spec:
      containers:
      - name: kiii-proekt-order
        image: mrceski/kiii-proekt-order:latest
        ports:
        - containerPort: 8080
        env:
          - name: SPRING_DATASOURCE_URL
            valueFrom:
              configMapKeyRef:
                name: kiii-proekt-config
                key: DATASOURCE_URL
          - name: SPRING_DATASOURCE_USERNAME
            valueFrom:
              configMapKeyRef:
                name: kiii-proekt-config
                key: DATASOURCE_USERNAME
          - name: SPRING_DATASOURCE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: kiii-proekt-secret
                key: DATASOURCE_PASSWORD
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 2